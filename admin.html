a class="call" href="'+tel(p.num)+'">☎ 電話する</a>';  else t+='<span class="call" style="background:var(--soft);color:var(--sub)">番号なし</span>';  t+='<a class="mail" href="mailto:'+encodeURIComponent(p.email)+'?subject='+   encodeURIComponent("安否確認について")+'">✉ メール</a></div>';  if(p.hasNum&&p.via_num!=="携帯")t+='<div class="mt">'+esc(p.num)+'（'+esc(p.via_num)+'）</div>';  return t+'</div>';} var fol=D.answered.filter(function(p){return p.follow;}); var rest=D.answered.filter(function(p){return !p.follow;}); if(fol.length){s+='<h2>🩹 対応が必要な人（'+fol.length+'名）</h2>'+  '<div class="card" style="padding:11px 13px;font-size:14px">'+  '<b>けがをしている、または出社できない人です。</b><br>'+  '電話かメールで、必要な手当てを確認してください。</div>';  fol.sort(function(a,b){var o={"重傷":0,"軽傷":1};   return (o[a.st]===undefined?2:o[a.st])-(o[b.st]===undefined?2:o[b.st]);});  fol.forEach(function(p){s+=card(p,false);});} if(rest.length){s+='<h2>回答があった人（'+rest.length+'名）</h2>';  rest.forEach(function(p){s+=card(p,true);});} s+='<button class="re" onclick="load()">🔄 最新の状況にする</button>'; m.innerHTML=s;}load();setInterval(function(){if(K()&&D)load();},60000);</script></body></html>
