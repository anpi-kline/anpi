<title>安否確認のしかた / Confirmação de Segurança</title>

<link rel="manifest" href="manifest.json">

<style>
/* =========================================================
   ★★★ 電話番号の設定はここだけ直せばOK ★★★
   Para alterar os telefones, edite somente esta parte.
   ========================================================= */
:root{
  --bg:#f2f5f9; --card:#fff; --line:#dde3ea; --txt:#16202c; --sub:#68758a;
  --accent:#0b63c5; --accent-soft:#e7f0fb;
  --safe:#127a41; --safe-bg:#e4f4ea; --safe-line:#9dd3b3;
  --mid:#b06d00;  --mid-bg:#fcf1de;  --mid-line:#e8c48a;
  --bad:#b8322a;  --bad-bg:#fbe9e7;  --bad-line:#eeaaa4;
  --band:#132540;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --card:#161d27; --line:#2a3442; --txt:#e8eef6; --sub:#95a3b6;
  --accent:#5aa9ff; --accent-soft:#152a42;
  --safe:#57d58a; --safe-bg:#0f2c1e; --safe-line:#1f5c3a;
  --mid:#f2b73d;  --mid-bg:#31260c;  --mid-line:#5c4a1c;
  --bad:#ff8f85;  --bad-bg:#381917;  --bad-line:#6b2f2a;
  --band:#0a121e;
}}
:root[data-theme="dark"]{
  --bg:#0e131a; --card:#161d27; --line:#2a3442; --txt:#e8eef6; --sub:#95a3b6;
  --accent:#5aa9ff; --accent-soft:#152a42;
  --safe:#57d58a; --safe-bg:#0f2c1e; --safe-line:#1f5c3a;
  --mid:#f2b73d;  --mid-bg:#31260c;  --mid-line:#5c4a1c;
  --bad:#ff8f85;  --bad-bg:#381917;  --bad-line:#6b2f2a;
  --band:#0a121e;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);
 font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,-apple-system,sans-serif;
 font-size:16px;line-height:1.8}
.band{background:var(--band);color:#fff;padding:14px 16px}
.band .inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.band h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.01em}
.band .sub{font-size:12px;opacity:.75;width:100%;margin-top:-2px}
.langsw{margin-left:auto;display:inline-flex;border:1.5px solid #46618c;border-radius:22px;overflow:hidden;flex:none}
.langsw button{background:transparent;border:none;color:#c7d4e6;padding:7px 15px;font-size:13.5px;cursor:pointer;font-family:inherit;font-weight:700}
.langsw button.on{background:#4da3ff;color:#062040}
main{max-width:640px;margin:0 auto;padding:18px 14px 70px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.step>h2{display:flex;align-items:flex-start;gap:10px;margin:0 0 8px;font-size:18px;line-height:1.45;text-wrap:balance}
.no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;
 display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;margin-top:2px}
p{margin:8px 0}
.lead{font-size:19px;font-weight:800;text-align:center;margin:4px 0 16px;text-wrap:balance}
.note{color:var(--sub);font-size:14px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.big3 div{border-radius:11px;padding:12px 4px;text-align:center;border:2px solid}
.big3 .n{display:block;font-size:34px;font-weight:800;line-height:1}
.big3 .w{font-size:13.5px;font-weight:800;display:block;margin-top:4px}
.c1{background:var(--safe-bg);border-color:var(--safe-line);color:var(--safe)}
.c2{background:var(--mid-bg);border-color:var(--mid-line);color:var(--mid)}
.c3{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
/* メール画面の見本 */
.mock{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0;background:var(--card)}
.mock .bar{background:var(--accent);color:#fff;padding:8px 12px;font-size:13px;font-weight:700}
.mock .fld{display:flex;border-bottom:1px solid var(--line);font-size:14px}
.mock .fld b{flex:none;width:64px;padding:10px 12px;color:var(--sub);font-weight:700;font-size:13px;background:var(--accent-soft)}
.mock .fld span{padding:10px 12px}
.mock .val{font-size:26px;font-weight:800;color:var(--safe);letter-spacing:.05em}
.mock .body{padding:12px;color:var(--sub);font-size:14px;min-height:64px}
.strike{text-decoration:line-through;color:var(--sub);opacity:.6}
.tel{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--accent);
 border-radius:12px;padding:13px 15px;text-decoration:none;color:var(--txt);margin-bottom:9px}
.tel:hover{background:var(--accent-soft)}
.tel .ico{font-size:22px}
.tel .who{font-size:13px;color:var(--sub);font-weight:700;display:block}
.tel .num{font-size:21px;font-weight:800;color:var(--accent);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.warn{background:var(--mid-bg);border:1px solid var(--mid-line);border-radius:11px;padding:12px 15px;font-size:14.5px;margin:12px 0}
.okbox{background:var(--safe-bg);border:1px solid var(--safe-line);border-radius:11px;padding:12px 15px;font-size:14.5px;margin:12px 0}
label{display:block;font-weight:800;font-size:14px;margin:14px 0 5px}
select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;
 font-family:inherit;font-size:16px;background:var(--card);color:var(--txt)}
.pickrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{border:2px solid var(--line);background:var(--card);border-radius:11px;padding:12px 4px;cursor:pointer;
 font-family:inherit;color:var(--txt);text-align:center;line-height:1.3}
.pick .n{display:block;font-size:26px;font-weight:800}
.pick .w{font-size:12.5px;font-weight:700}
.pick[aria-pressed="true"].p1{background:var(--safe-bg);border-color:var(--safe);color:var(--safe)}
.pick[aria-pressed="true"].p2{background:var(--mid-bg);border-color:var(--mid);color:var(--mid)}
.pick[aria-pressed="true"].p3{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
button.go{width:100%;margin-top:16px;background:var(--accent);color:#fff;border:none;border-radius:10px;
 padding:15px;font-size:16.5px;font-weight:800;font-family:inherit;cursor:pointer}
button.go:hover{filter:brightness(1.1)}
.ghost{background:var(--card);color:var(--accent);border:1.5px solid var(--accent);border-radius:9px;
 padding:9px 16px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
details{border-top:1px solid var(--line);padding:12px 0}
details:first-of-type{border-top:none}
summary{font-weight:800;cursor:pointer;font-size:15px}
details p{font-size:14.5px;color:var(--sub);margin:8px 0 0}
footer{text-align:center;color:var(--sub);font-size:13px;padding:24px 14px 40px}
.hide{display:none}
@media print{
 :root{--bg:#fff;--card:#fff;--txt:#111;--sub:#555;--line:#bbb;--accent:#0b63c5}
 .band .langsw,.noprint{display:none!important} body{font-size:13px}
 .step{break-inside:avoid;border:1px solid #ccc}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

 <section class="step">
  <h2><span class="no">3</span>${esc(x.s3)}</h2>
  <p>${esc(x.s3p)}</p>
  ${TEL.map(c=>{
    /* 伏せ字（090-XXXX-XXXX）のままだと壊れた発信リンクになるので、その場合は押せなくする */
    const masked=/[xX＊*]/.test(c.num);
    const inner=`<span class="ico">☎</span><span>
      <span class="who">${esc(lang==='pt'?c.pt:c.ja)}</span>
      <span class="num">${esc(c.num)}</span>
      ${masked?`<span class="note" style="display:block;font-size:12px">${esc(x.tel_masked)}</span>`:''}</span>`;
    return masked
      ? `<div class="tel" style="border-color:var(--line);opacity:.75">${inner}</div>`
      : `<a class="tel" href="${dial(c.num)}">${inner}</a>`;
   }).join('')}
  <div class="warn">${x.s3warn}</div>
 </section>

 <section class="step">
  <h2><span class="no">4</span>${esc(x.s4)}</h2>
  <p>${x.s4p}</p>
  <div id="formarea">
   <label>${esc(x.fq)} <span style="color:var(--bad)">${esc(x.freq)}</span></label>
   <div class="pickrow">
    ${[1,2,3].map(i=>`<button type="button" class="pick p${i}" aria-pressed="false" onclick="setPick(${i})">
      <span class="n">${i}</span><span class="w">${esc(x['n'+i])}</span></button>`).join('')}
   </div>
   <label>${esc(x.fwork)}</label>
   <select id="q_work">${opts(['wok','wng','wtbd'])}</select>
   <label>${esc(x.ffam)}</label>
   <select id="q_fam">${opts(['fok','fng','finj'])}</select>
   <label>${esc(x.fhouse)}</label>
   <select id="q_house">${opts(['hok','hpart','hbad'])}</select>
   <label>${esc(x.loc_l)}</label>
   <p class="note" style="margin:0 0 7px">${esc(x.loc_why)}</p>
   <button type="button" class="ghost" style="width:100%;padding:12px" onclick="getLoc()">${esc(x.loc_btn)}</button>
   <div id="locbox"></div>
   <label>${esc(x.fmsg)}</label>
   <textarea id="q_msg" rows="3" placeholder="${esc(x.fmsgph)}"></textarea>
   <button class="go" onclick="submitForm()">${esc(x.send)}</button>
  </div>
  <div id="doneArea" class="hide"></div>
 </section>

 <section class="step">
  <h2 style="font-size:17px">❓ ${esc(x.qh)}</h2>
  ${x.q.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}
 </section>

 ${isApp()?'':`<section class="step noprint" style="border-color:var(--accent)">
  <h2 style="font-size:17px">${esc(x.inst)}</h2>
  <p>${esc(x.instp)}</p>
  <p class="note" style="background:var(--accent-soft);padding:11px 14px;border-radius:9px">${x.insti}<br>${x.insta}</p>
 </section>`}

 <p class="noprint" style="text-align:center"><button class="ghost" onclick="window.print()">🖨 ${esc(x.print)}</button></p>`;
}
/* すでにアプリとして開かれているかどうか */
function isApp(){
 return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
}

function setPick(i){
 pick=i;
 document.querySelectorAll('.pick').forEach((b,idx)=>b.setAttribute('aria-pressed',String(idx+1===i)));
}

/* ===== 位置情報 =====
   本人がボタンを押したときだけ1回だけ調べる。見張り続けることはしない。 */
var geo=null;
function mapUrl(g){return 'https://www.google.com/maps?q='+g.lat+','+g.lng;}
function locMsg(cls,html){
 const b=document.getElementById('locbox');
 if(b)b.innerHTML='<div class="'+cls+'" style="margin:9px 0 0">'+html+'</div>';
}
function getLoc(){
 const x=T[lang];
 if(!navigator.geolocation){locMsg('warn',esc(x.loc_na));return;}
 if(location.protocol==='file:'){locMsg('warn',esc(x.loc_https));return;}
 locMsg('okbox',esc(x.loc_wait));
 navigator.geolocation.getCurrentPosition(function(p){
  geo={lat:p.coords.latitude.toFixed(6),lng:p.coords.longitude.toFixed(6),
       acc:Math.round(p.coords.accuracy)};
  showLoc();
 },function(err){
  geo=null;
  const m=(err.code===1)?x.loc_deny:(err.code===3?x.loc_time:x.loc_na);
  locMsg('warn',esc(m));
 },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function showLoc(){
 const x=T[lang];
 if(!geo){const b=document.getElementById('locbox');if(b)b.innerHTML='';return;}
 locMsg('okbox','<b>✅ '+esc(x.loc_ok)+'</b><br>'+
  '<span style="font-family:Consolas,monospace;font-size:14px">'+esc(geo.lat)+', '+esc(geo.lng)+'</span>'+
  '<span class="note"> （'+esc(x.loc_acc)+' '+geo.acc+'m）</span><br>'+
  '<a href="'+mapUrl(geo)+'" target="_blank" rel="noopener">'+esc(x.loc_map)+'</a>'+
  ' ／ <a href="#" onclick="geo=null;showLoc();return false;">'+esc(x.loc_clear)+'</a>');
}
function submitForm(){
 const x=T[lang];
 if(!pick){alert(x.needst);return;}
 const v=id=>document.getElementById(id).value;
 const msg=v('q_msg').trim();
 document.getElementById('formarea').classList.add('hide');
 const d=document.getElementById('doneArea');
 d.className='';
 d.innerHTML=`<div class="okbox"><b style="font-size:16px">${esc(x.done)}</b><br>${esc(x.donep)}</div>
  <table style="width:100%;font-size:14.5px;border-collapse:collapse">
   <tr><td style="padding:6px 0;color:var(--sub)">${esc(x.fq)}</td><td><b>${pick} ${esc(x['n'+pick])}</b></td></tr>
   <tr><td style="padding:6px 0;color:var(--sub)">${esc(x.fwork)}</td><td>${esc(dv(v('q_work')))}</td></tr>
   <tr><td style="padding:6px 0;color:var(--sub)">${esc(x.ffam)}</td><td>${esc(dv(v('q_fam')))}</td></tr>
   <tr><td style="padding:6px 0;color:var(--sub)">${esc(x.fhouse)}</td><td>${esc(dv(v('q_house')))}</td></tr>
   ${geo?`<tr><td style="padding:6px 0;color:var(--sub)">${esc(x.loc_l)}</td><td>
     <a href="${mapUrl(geo)}" target="_blank" rel="noopener">${esc(x.loc_map)}</a>
     <span class="note">（${esc(geo.lat)}, ${esc(geo.lng)}）</span></td></tr>`:''}
   ${msg?`<tr><td style="padding:6px 0;color:var(--sub)">${esc(x.fmsg)}</td><td>${esc(msg)}</td></tr>`:''}
  </table>
  ${MAIL?`<p style="margin-top:14px"><button class="go" onclick="sendMail()">${esc(x.mail_btn)}</button></p>
   <p class="note" style="margin-top:-4px">${esc(x.mail_note)}</p>`:''}
  <p><button class="ghost" onclick="render()">${esc(x.again)}</button></p>`;
 d.scrollIntoView({behavior:'smooth',block:'center'});
}

/* 報告内容をメールにして送る（件名は番号だけ＝会社側で自動集計できる形） */
function sendMail(){
 const x=T[lang];
 const v=id=>{const e=document.getElementById(id);return e?e.value:'';};
 const L=[];
 L.push(x.fq+'： '+pick+' '+x['n'+pick]);
 L.push(x.fwork+'： '+dv(v('q_work')));
 L.push(x.ffam+'： '+dv(v('q_fam')));
 L.push(x.fhouse+'： '+dv(v('q_house')));
 if(geo)L.push(x.loc_l+'： '+geo.lat+', '+geo.lng+'（'+x.loc_acc+' '+geo.acc+'m）\n'+mapUrl(geo));
 const m=v('q_msg').trim();
 if(m)L.push(x.fmsg+'： '+m);
 const body=L.join('\n')+'\n\n----\n'+(lang==='pt'?ORG_PT:ORG);
 location.href='mailto:'+encodeURIComponent(MAIL)
  +'?subject='+encodeURIComponent(String(pick))
  +'&body='+encodeURIComponent(body);
}

document.documentElement.lang=(lang==='pt'?'pt-BR':'ja');
render();

/* 圏外でも開けるようにする（インターネットに置いたときだけ働きます） */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
 window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
<script src="config.js"></script>
<script src="contacts-loader.js"></script>
<script src="submit.js"></script>
</body>
</html>
